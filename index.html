<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Scripts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Panel de Scripts</a>
        <nav class="site-nav">
            <a href="/">Inicio</a>
            <a href="/scripts.html">Scripts</a>
        </nav>
    </header>

    <main>
        <section class="hero hero-home">
            <div class="hero-copy">
                <span class="eyebrow">Sistema</span>
                <h1>Panel de scripts</h1>
                <p>Seleccion de herramientas para cargar archivos, ejecutar procesos y descargar resultados.</p>
                <div class="hero-actions">
                    <a class="primary-link" href="/scripts.html">Entrar al panel</a>
                </div>
            </div>
            <div class="hero-panel">
                <div class="hero-card hero-summary">
                    <strong>Acceso principal</strong>
                    <div class="summary-grid">
                        <div class="summary-item">
                            <span class="summary-label">Carga</span>
                            <span class="summary-value">Excel y CSV</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Ejecucion</span>
                            <span class="summary-value">Scripts</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Salida</span>
                            <span class="summary-value">Descarga</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span>Panel de Scripts</span>
        <a href="/scripts.html">Abrir herramientas</a>
    </footer>
</body>
</html>
