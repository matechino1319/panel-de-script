<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — LA YUNTA</title>
    <meta name="description" content="Acceso al portal de herramientas y scripts de LA YUNTA.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="glow-bg"></div>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-icon-wrap" style="width: 52px; height: 52px; margin: 0 auto 16px auto;">
                    <img src="logo_la_yunta_highres.png" alt="Logo LA YUNTA" onerror="this.style.display='none'">
                </div>
                <div class="badge" style="margin-bottom: 12px;">
                    <span class="badge-dot pulse"></span>
                    <span>Acceso al Sistema</span>
                </div>
                <h1 class="login-title">LA YUNTA</h1>
                <p class="login-subtitle">Departamento de Informática</p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tab-login">Iniciar Sesión</button>
                <button type="button" class="auth-tab" id="tab-register">Crear Administrador</button>
            </div>

            <!-- Formulario 1: Iniciar Sesión -->
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Usuario u Operador</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" class="login-input" placeholder="Ej: admin, mateo..." autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" class="login-input" placeholder="••••••••" autocomplete="current-password">
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Recordar sesión</span>
                    </label>
                </div>

                <button type="submit" class="primary-btn login-btn">
                    <span>Iniciar Sesión</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </button>
            </form>

            <!-- Formulario 2: Crear Nuevo Administrador -->
            <form id="register-form" class="login-form" style="display: none;">
                <div class="form-group">
                    <label for="reg-fullname" class="form-label">Nombre Completo</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="reg-fullname" class="login-input" placeholder="Ej: Mateo Martínez">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-username" class="form-label">Usuario</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
                        </svg>
                        <input type="text" id="reg-username" class="login-input" placeholder="Ej: mateo" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password" class="form-label">Contraseña</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="reg-password" class="login-input" placeholder="Mínimo 4 caracteres" autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password-confirm" class="form-label">Confirmar Contraseña</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <polyline points="9 12 11 14 15 10"></polyline>
                        </svg>
                        <input type="password" id="reg-password-confirm" class="login-input" placeholder="Repetí la contraseña" autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="primary-btn login-btn" style="background: linear-gradient(135deg, #10b981, #059669);">
                    <span>Registrar Administrador</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </button>
            </form>

            <div id="auth-alert" style="display: none; margin-top: 14px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; text-align: center;"></div>

            <div class="login-footer">
                <p class="login-footer-hint">Todos los usuarios creados tendrán rol de <strong>Administrador</strong>.</p>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        // Pestañas
        const tabLogin = document.getElementById("tab-login");
        const tabRegister = document.getElementById("tab-register");
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const authAlert = document.getElementById("auth-alert");

        function showAlert(msg, isSuccess = false) {
            authAlert.textContent = msg;
            authAlert.style.display = "block";
            if (isSuccess) {
                authAlert.style.background = "#ecfdf5";
                authAlert.style.border = "1px solid rgba(16, 185, 129, 0.3)";
                authAlert.style.color = "#047857";
            } else {
                authAlert.style.background = "#fef2f2";
                authAlert.style.border = "1px solid rgba(230, 10, 21, 0.25)";
                authAlert.style.color = "var(--primary)";
            }
        }

        function hideAlert() {
            authAlert.style.display = "none";
            authAlert.textContent = "";
        }

        tabLogin.addEventListener("click", () => {
            tabLogin.classList.add("active");
            tabRegister.classList.remove("active");
            loginForm.style.display = "flex";
            registerForm.style.display = "none";
            hideAlert();
        });

        tabRegister.addEventListener("click", () => {
            tabRegister.classList.add("active");
            tabLogin.classList.remove("active");
            registerForm.style.display = "flex";
            loginForm.style.display = "none";
            hideAlert();
        });

        // Submit Login
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();
            
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const remember = document.getElementById("remember-me").checked;
            const submitBtn = loginForm.querySelector(".login-btn");

            if (!username || !password) {
                showAlert("Ingresá usuario y contraseña.");
                return;
            }

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            submitBtn.innerHTML = "<span>Verificando...</span>";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario: username, password: password })
                });

                let data = null;
                try { data = await response.json(); } catch (_) {}

                if (response.ok && data && data.success) {
                    const displayName = data.user.nombre_completo || data.user.usuario || username;
                    loginUser(displayName, remember);
                    window.location.href = "index.html";
                } else {
                    const errorMsg = (data && data.error) ? data.error : "Credenciales incorrectas.";
                    showAlert(errorMsg);
                }
            } catch (err) {
                showAlert("Error de conexión con el servidor.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.innerHTML = originalBtnText;
            }
        });

        // Submit Registro Administrador
        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            hideAlert();

            const fullname = document.getElementById("reg-fullname").value.trim();
            const username = document.getElementById("reg-username").value.trim();
            const password = document.getElementById("reg-password").value.trim();
            const confirmPass = document.getElementById("reg-password-confirm").value.trim();
            const submitBtn = registerForm.querySelector(".login-btn");

            if (!username) {
                showAlert("El nombre de usuario es obligatorio.");
                return;
            }
            if (username.length < 3) {
                showAlert("El usuario debe tener al menos 3 caracteres.");
                return;
            }
            if (!password || password.length < 4) {
                showAlert("La contraseña debe tener al menos 4 caracteres.");
                return;
            }
            if (password !== confirmPass) {
                showAlert("Las contraseñas no coinciden.");
                return;
            }

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            submitBtn.innerHTML = "<span>Registrando administrador...</span>";

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        usuario: username,
                        nombre_completo: fullname || username,
                        password: password
                    })
                });

                let data = null;
                try { data = await response.json(); } catch (_) {}

                if (response.ok && data && data.success) {
                    showAlert("¡Usuario administrador creado con éxito! Ingresando...", true);
                    const displayName = data.user.nombre_completo || data.user.usuario || username;
                    loginUser(displayName, true);
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                } else {
                    showAlert((data && data.error) ? data.error : "No se pudo registrar el usuario.");
                }
            } catch (err) {
                showAlert("Error de conexión al registrar usuario.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.innerHTML = originalBtnText;
            }
        });
    </script>
</body>
</html>
