<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — LA YUNTA</title>
    <meta name="description" content="Acceso al portal de herramientas y scripts de LA YUNTA.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="glow-bg"></div>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-icon-wrap" style="width: 52px; height: 52px; margin: 0 auto 16px auto;">
                    <img src="logo_la_yunta_highres.png" alt="Logo LA YUNTA" onerror="this.style.display='none'">
                </div>
                <div class="badge" style="margin-bottom: 12px;">
                    <span class="badge-dot pulse"></span>
                    <span>Acceso al Sistema</span>
                </div>
                <h1 class="login-title">LA YUNTA</h1>
                <p class="login-subtitle">Departamento de Informática</p>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Usuario u Operador</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" class="login-input" placeholder="Ej: admin, mateo..." autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" class="login-input" placeholder="••••••••" autocomplete="current-password">
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Recordar sesión</span>
                    </label>
                </div>

                <button type="submit" class="primary-btn login-btn">
                    <span>Iniciar Sesión</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </button>
            </form>

            <div id="login-error" style="display: none; margin-top: 14px; padding: 10px 14px; background: #fef2f2; border: 1px solid rgba(230,10,21,0.25); border-radius: var(--radius-sm); color: var(--primary); font-size: 0.85rem; font-weight: 600; text-align: center;"></div>

            <div class="login-footer">
                <p class="login-footer-hint">Usuario predeterminado: <strong>admin</strong> | Clave: <strong>admin123</strong></p>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        const form = document.getElementById("login-form");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const rememberInput = document.getElementById("remember-me");
        const errorDiv = document.getElementById("login-error");
        const submitBtn = form.querySelector(".login-btn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorDiv.style.display = "none";
            errorDiv.textContent = "";
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();
            const remember = rememberInput ? rememberInput.checked : true;

            if (!username || !password) {
                errorDiv.textContent = "Ingresá usuario y contraseña.";
                errorDiv.style.display = "block";
                return;
            }

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            submitBtn.innerHTML = "<span>Verificando...</span>";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ usuario: username, password: password })
                });

                let data = null;
                try {
                    data = await response.json();
                } catch (_) {
                    data = null;
                }

                if (response.ok && data && data.success) {
                    const displayName = data.user.nombre_completo || data.user.usuario || username;
                    loginUser(displayName, remember);
                    window.location.href = "index.html";
                } else {
                    const errorMsg = (data && data.error) ? data.error : "Credenciales incorrectas.";
                    errorDiv.textContent = errorMsg;
                    errorDiv.style.display = "block";
                }
            } catch (err) {
                errorDiv.textContent = "Error de conexión con el servidor. Verificá que el backend esté activo.";
                errorDiv.style.display = "block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.innerHTML = originalBtnText;
            }
        });
    </script>
</body>
</html>
