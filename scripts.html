<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Scripts — LA YUNTA</title>
    <meta name="description" content="Elegí una herramienta, subí el archivo y ejecutá el proceso.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-bg"></div>

    <header class="site-header">
        <a class="brand" href="/">
            <div class="brand-icon-wrap">
                <img src="logo_la_yunta_highres.png" alt="Logo LA YUNTA" onerror="this.style.display='none'">
            </div>
            <div class="brand-text">
                <span class="brand-title">LA YUNTA</span>
                <span class="brand-sub">Informática</span>
            </div>
        </a>
        <nav class="site-nav">
            <a href="/" class="nav-link">Inicio</a>
            <a href="/scripts.html" class="nav-link active">Scripts</a>
            <a href="/descargas.html" class="nav-link">Descargas</a>
        </nav>
    </header>

    <main class="panel-page">
        <div class="panel-header" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
            <div class="panel-title-area">
                <div class="badge" style="margin-bottom: 12px;">
                    <span class="badge-dot pulse"></span>
                    <span id="server-status">Conectando...</span>
                </div>
                <h1>Panel de <span class="highlight" style="color: var(--primary);">Scripts</span></h1>
                <p>Elegí una herramienta, subí el archivo y ejecutá el proceso de automatización.</p>
            </div>
            <div>
                <button type="button" class="primary-btn" id="btn-open-new-script" style="padding: 12px 20px; font-size: 0.95rem; background: linear-gradient(135deg, var(--primary), var(--primary-hover));">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Subir Nuevo Script</span>
                </button>
            </div>
        </div>

        <section class="panel-controls">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input id="search-input" class="search-input" type="search" placeholder="Buscar script...">
            </div>

            <div class="filter-tags" id="filter-tags">
                <button class="filter-tag active" data-filter="all">Todos</button>
                <button class="filter-tag" data-filter="excel">Excel</button>
                <button class="filter-tag" data-filter="csv">CSV</button>
                <button class="filter-tag" data-filter="custom">Personalizados</button>
            </div>
        </section>


        <section class="scripts-grid" id="scripts-grid">
            <div class="loading-skeleton-grid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>
    </main>

    <!-- Modal para Subir Nuevo Script -->
    <div id="new-script-modal" class="user-modal-backdrop" style="display: none;">
        <div class="user-modal-card" style="max-width: 500px;">
            <div class="user-modal-header">
                <h3 class="user-modal-title">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                    <span>Subir Nuevo Script</span>
                </h3>
                <button type="button" class="user-modal-close" id="close-script-modal">&times;</button>
            </div>

            <form id="create-script-form" class="login-form">
                <div class="form-group">
                    <label for="script-title-input" class="form-label">Título de la Herramienta</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <input type="text" id="script-title-input" class="login-input" placeholder="Ej: Control de Stock Diario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="script-desc-input" class="form-label">Descripción</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="21" y1="10" x2="3" y2="10"></line>
                            <line x1="21" y1="6" x2="3" y2="6"></line>
                            <line x1="21" y1="14" x2="3" y2="14"></line>
                            <line x1="21" y1="18" x2="3" y2="18"></line>
                        </svg>
                        <input type="text" id="script-desc-input" class="login-input" placeholder="Breve descripción del reporte o cálculo">
                    </div>
                </div>

                <div class="form-group">
                    <label for="script-accept-input" class="form-label">Archivos de entrada soportados</label>
                    <div class="input-icon-wrap">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        </svg>
                        <input type="text" id="script-accept-input" class="login-input" value=".xlsx,.xls,.csv" placeholder="Ej: .xlsx,.xls,.csv">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Archivo Python (.py)</label>
                    <input type="file" id="script-file-input" accept=".py" required style="padding: 10px; border: 1px dashed var(--border-color); border-radius: var(--radius-md); background: #f8fafc; font-size: 0.88rem; width: 100%;">
                </div>

                <button type="submit" class="primary-btn login-btn" style="margin-top: 6px;">
                    <span>Guardar y Publicar Script</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </form>

            <div id="script-modal-alert" style="display: none; margin-top: 14px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; text-align: center;"></div>
        </div>
    </div>

    <!-- Modal para Editar Script -->
    <div id="edit-script-modal" class="user-modal-backdrop" style="display: none;">
        <div class="user-modal-card" style="max-width: 480px;">
            <div class="user-modal-header">
                <h3 class="user-modal-title">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    <span>Editar Script</span>
                </h3>
                <button type="button" class="user-modal-close" id="close-edit-script-modal">&times;</button>
            </div>

            <form id="edit-script-form" class="login-form">
                <input type="hidden" id="edit-script-id">

                <div class="form-group">
                    <label for="edit-script-title" class="form-label">Título de la Herramienta</label>
                    <input type="text" id="edit-script-title" class="login-input" required>
                </div>

                <div class="form-group">
                    <label for="edit-script-desc" class="form-label">Descripción</label>
                    <input type="text" id="edit-script-desc" class="login-input">
                </div>

                <div class="form-group">
                    <label for="edit-script-accept" class="form-label">Formatos soportados</label>
                    <input type="text" id="edit-script-accept" class="login-input" placeholder="Ej: .xlsx,.xls,.csv">
                </div>

                <button type="submit" class="primary-btn login-btn" style="margin-top: 6px;">
                    <span>Guardar Cambios</span>
                </button>
            </form>

            <div id="edit-script-alert" style="display: none; margin-top: 14px; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; text-align: center;"></div>
        </div>
    </div>

    <!-- Contenedor para mensajes Toast -->
    <div id="toast-container" class="toast-container"></div>

    <footer class="site-footer">
        <div class="footer-content">
            <span>© LA YUNTA — Departamento de Informática</span>
            <a href="/" class="footer-link">&larr; Volver al inicio</a>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
